name: Create Stable Release

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        required: true
        type: choice
        options:
          - arthas
          - golang
          - inspektor-gadget
          - kubernetes-logs
          - kubernetes-metrics
          - opensearch
          - postgres
          - s3
          - sql-server
      version:
        description: Stable version to release, without the v prefix (e.g. 1.2.3).
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          OWNER: ${{ github.repository_owner }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "image_owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.plugin }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PLUGIN=${{ inputs.plugin }}
            VERSION=${{ steps.version.outputs.tag }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ steps.version.outputs.image_owner }}/mission-control-plugins/${{ inputs.plugin }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ steps.version.outputs.image_owner }}/mission-control-plugins/${{ inputs.plugin }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.4

      - name: Package Helm chart
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          chart_dir="$PLUGIN/chart"
          sed -i -E "s/^version:.*/version: ${VERSION}/" "$chart_dir/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" "$chart_dir/Chart.yaml"
          helm package -d dist "$chart_dir"

      - name: Upload Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  push-helm-chart:
    needs: release
    permissions:
      actions: read
      contents: read
    uses: flanksource/action-workflows/.github/workflows/push-helm-chart.yml@v1
    with:
      filename_regex: mission-control-plugin-*.tgz
      version: ${{ needs.release.outputs.version }}
      pr_title: Release ${{ needs.release.outputs.tag }} of mission-control-plugin-${{ inputs.plugin }}
    secrets:
      app_id: ${{ secrets.FLANKSOURCE_APP_ID }}
      app_private_key: ${{ secrets.FLANKSOURCE_APP_SECRET }}

  github-release:
    needs: [release, push-helm-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
