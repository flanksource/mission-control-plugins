name: Release Plugin Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild binaries for (leave empty to create a new release).
        required: false
        type: string

permissions:
  contents: read

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Create release tag
        id: semantic
        if: inputs.tag == ''
        # codfish/semantic-release-action v5.0.0
        # https://github.com/codfish/semantic-release-action/releases/tag/v5.0.0
        uses: codfish/semantic-release-action@6abd188d2458e2fd6c99073454f6cc49196362e8
        with:
          # release.config.cjs uses this non-default preset to parse scoped
          # Conventional Commits like `fix(postgres): ...`.
          additional-packages: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: release
        if: inputs.tag != '' || steps.semantic.outputs.new-release-published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXISTING_TAG: ${{ inputs.tag }}
          NEW_VERSION: ${{ steps.semantic.outputs.release-version }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_TAG" ]; then
            git check-ref-format "refs/tags/$EXISTING_TAG"
            git show-ref --verify "refs/tags/$EXISTING_TAG"
            gh release view --repo "$REPO" --json tagName --jq .tagName -- "$EXISTING_TAG"
            tag="$EXISTING_TAG"
          else
            tag="v$NEW_VERSION"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Discover plugins in release tag
        id: plugins
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          plugins=$(git ls-tree -r --name-only "refs/tags/$RELEASE_TAG" | jq -Rsc 'split("\n") | map(select(test("^[^/]+/Plugin\\.yaml$")) | split("/")[0]) | sort')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/build-plugin-binaries.yaml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.tag }}
      plugins: ${{ needs.tag.outputs.plugins }}

  publish-assets:
    name: Publish assets for ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - tag
      - build
    if: needs.tag.outputs.tag != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.tar.gz > "${{ needs.tag.outputs.tag }}_checksums.txt"
          else
            shasum -a 256 *.tar.gz > "${{ needs.tag.outputs.tag }}_checksums.txt"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          make_latest: ${{ inputs.tag == '' && 'true' || '' }}
          files: |
            dist/*.tar.gz
            dist/${{ needs.tag.outputs.tag }}_checksums.txt
