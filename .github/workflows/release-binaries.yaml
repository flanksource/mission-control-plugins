name: Release Plugin Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild binaries for (leave empty to create a new release).
        required: false
        type: string

permissions:
  contents: read

jobs:
  create-release:
    if: inputs.tag == ''
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: flanksource/action-workflows/.github/workflows/create-release.yml@807c141342c97374e637b4375e3a54e62cd8736e
    with:
      extra_plugins: conventional-changelog-conventionalcommits

  tag:
    name: Resolve release tag
    needs: create-release
    # Existing-tag rebuilds must run even though create-release is skipped.
    if: ${{ !cancelled() && (inputs.tag != '' || needs.create-release.outputs.published == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXISTING_TAG: ${{ inputs.tag }}
          NEW_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_TAG" ]; then
            git check-ref-format "refs/tags/$EXISTING_TAG"
            git show-ref --verify "refs/tags/$EXISTING_TAG"
            gh release view --repo "$REPO" --json tagName --jq .tagName -- "$EXISTING_TAG"
            tag="$EXISTING_TAG"
          else
            tag="$NEW_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Discover plugins in release tag
        id: plugins
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          plugins=$(git ls-tree -r --name-only "refs/tags/$RELEASE_TAG" | jq -Rsc 'split("\n") | map(select(test("^[^/]+/Plugin\\.yaml$")) | split("/")[0]) | sort')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/build-plugin-binaries.yaml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.tag }}
      plugins: ${{ needs.tag.outputs.plugins }}

  publish-assets:
    name: Publish assets for ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - tag
      - build
    if: needs.tag.outputs.tag != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.tar.gz > "${{ needs.tag.outputs.tag }}_checksums.txt"
          else
            shasum -a 256 *.tar.gz > "${{ needs.tag.outputs.tag }}_checksums.txt"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          make_latest: ${{ inputs.tag == '' && 'true' || '' }}
          files: |
            dist/*.tar.gz
            dist/${{ needs.tag.outputs.tag }}_checksums.txt
