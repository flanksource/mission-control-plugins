name: Create Beta Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image_owner: ${{ steps.version.outputs.image_owner }}
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Discover plugins in release commit
        id: plugins
        run: |
          plugins=$(git ls-tree -r --name-only HEAD | jq -Rsc 'split("\n") | map(select(test("^[^/]+/Plugin\\.yaml$")) | split("/")[0]) | sort')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

      - name: Determine beta version from latest stable GitHub release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          latest_stable=$(gh release list --repo "$REPO" --exclude-drafts --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease | not)][0].tagName // "v0.0.0"')
          base="${latest_stable#v}"
          version="${base}-beta.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "image_owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.plugin }} beta
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.version.outputs.plugins) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.plugin }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PLUGIN=${{ matrix.plugin }}
            VERSION=${{ needs.version.outputs.tag }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ needs.version.outputs.image_owner }}/mission-control-plugins/${{ matrix.plugin }}:${{ needs.version.outputs.tag }}
            ghcr.io/${{ needs.version.outputs.image_owner }}/mission-control-plugins/${{ matrix.plugin }}:beta

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.4

      - name: Package Helm chart
        env:
          PLUGIN: ${{ matrix.plugin }}
          VERSION: ${{ needs.version.outputs.version }}
          APP_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          chart_dir="$PLUGIN/chart"
          sed -i -E "s/^version:.*/version: ${VERSION}/" "$chart_dir/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" "$chart_dir/Chart.yaml"
          helm package -d dist "$chart_dir"

      - name: Upload Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ matrix.plugin }}
          path: dist/*.tgz
          if-no-files-found: error

  collect-charts:
    # Paused with Helm publishing until the App private key is available: https://github.com/flanksource/mission-control-plugins/issues/113
    if: false
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: helm-chart-*
          path: dist
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  push-helm-chart:
    # Restore this job and the release dependency when #113 is resolved.
    if: false
    needs: [version, collect-charts]
    permissions:
      actions: read
      contents: read
    uses: flanksource/action-workflows/.github/workflows/push-helm-chart.yml@807c141342c97374e637b4375e3a54e62cd8736e
    with:
      filename_regex: mission-control-plugin-*.tgz
      version: ${{ needs.version.outputs.version }}
      pr_title: Release beta ${{ needs.version.outputs.tag }} of mission-control-plugins
    secrets:
      app_id: ${{ secrets.FLANKSOURCE_APP_ID }}
      app_private_key: ${{ secrets.FLANKSOURCE_APP_SECRET }}

  build-binaries:
    needs: version
    uses: ./.github/workflows/build-plugin-binaries.yaml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.tag }}
      plugins: ${{ needs.version.outputs.plugins }}

  github-prerelease:
    name: Create GitHub beta prerelease
    needs:
      - version
      - publish
      - build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v6
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: sha256sum *.tar.gz > "${TAG}_checksums.txt"

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/${{ needs.version.outputs.tag }}_checksums.txt
